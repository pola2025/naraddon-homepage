<!DOCTYPE html>
<html>
<head>
  <title>정책소식 이미지 업로드 테스트</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .test-section {
      border: 2px solid #ddd;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
    }
    button {
      background: #0070f3;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover { background: #0051cc; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    input[type="file"] {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 4px;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    pre {
      background: #f5f5f5;
      padding: 10px;
      overflow-x: auto;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>🖼️ 정책소식 이미지 업로드 테스트</h1>

  <!-- 세션 확인 -->
  <div class="test-section">
    <h2>1️⃣ 세션 확인</h2>
    <button onclick="checkSession()">세션 확인</button>
    <div id="sessionResult"></div>
  </div>

  <!-- 파일 선택 테스트 -->
  <div class="test-section">
    <h2>2️⃣ 파일 선택 테스트</h2>
    <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
    <div id="fileInfo"></div>
  </div>

  <!-- 이미지 업로드 테스트 -->
  <div class="test-section">
    <h2>3️⃣ 이미지 업로드 테스트</h2>
    <button onclick="testUpload()" id="uploadBtn">이미지 업로드 시작</button>
    <div id="uploadResult"></div>
  </div>

  <script>
    let selectedFile = null;

    // 세션 확인
    async function checkSession() {
      const resultDiv = document.getElementById('sessionResult');
      resultDiv.innerHTML = '<p>🔍 세션 확인 중...</p>';

      try {
        const response = await fetch('/api/auth/session');
        const session = await response.json();

        const isAdmin = session.user?.role === 'admin' || session.user?.role === 'super_admin';

        resultDiv.innerHTML = `
          <div class="result ${isAdmin ? 'success' : 'error'}">
            <h3>${isAdmin ? '✅ 관리자 인증됨' : '❌ 관리자 권한 없음'}</h3>
            <pre>${JSON.stringify(session, null, 2)}</pre>
          </div>
        `;
      } catch (error) {
        resultDiv.innerHTML = `
          <div class="result error">
            <h3>❌ 오류 발생</h3>
            <p>${error.message}</p>
          </div>
        `;
      }
    }

    // 파일 선택 핸들러
    function handleFileSelect(event) {
      const file = event.target.files[0];
      const infoDiv = document.getElementById('fileInfo');

      if (!file) {
        infoDiv.innerHTML = '';
        selectedFile = null;
        return;
      }

      selectedFile = file;

      infoDiv.innerHTML = `
        <div class="result success">
          <h3>✅ 파일 선택됨</h3>
          <p><strong>파일명:</strong> ${file.name}</p>
          <p><strong>크기:</strong> ${(file.size / 1024).toFixed(2)} KB</p>
          <p><strong>타입:</strong> ${file.type}</p>
        </div>
      `;

      document.getElementById('uploadBtn').disabled = false;
    }

    // 이미지 업로드
    async function testUpload() {
      const resultDiv = document.getElementById('uploadResult');
      const uploadBtn = document.getElementById('uploadBtn');

      if (!selectedFile) {
        // 테스트용 더미 파일 생성
        const blob = new Blob([
          new Uint8Array([
            0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A,
            0x00, 0x00, 0x00, 0x0D, 0x49, 0x48, 0x44, 0x52,
            0x00, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00, 0x01,
            0x08, 0x06, 0x00, 0x00, 0x00, 0x1F, 0x15, 0xC4,
            0x89, 0x00, 0x00, 0x00, 0x0A, 0x49, 0x44, 0x41,
            0x54, 0x78, 0x9C, 0x63, 0x00, 0x01, 0x00, 0x00,
            0x05, 0x00, 0x01, 0x0D, 0x0A, 0x2D, 0xB4, 0x00,
            0x00, 0x00, 0x00, 0x49, 0x45, 0x4E, 0x44, 0xAE,
            0x42, 0x60, 0x82
          ])
        ], { type: 'image/png' });
        selectedFile = new File([blob], 'test.png', { type: 'image/png' });
      }

      resultDiv.innerHTML = '<p>📤 업로드 중...</p>';
      uploadBtn.disabled = true;

      try {
        const formData = new FormData();
        formData.append('file', selectedFile);

        console.log('📤 업로드 요청:', {
          fileName: selectedFile.name,
          fileSize: selectedFile.size,
          fileType: selectedFile.type
        });

        const response = await fetch('/api/policy-news/upload-image', {
          method: 'POST',
          body: formData,
        });

        const result = await response.json();

        console.log('📥 응답:', { status: response.status, result });

        if (response.ok) {
          resultDiv.innerHTML = `
            <div class="result success">
              <h3>✅ 업로드 성공!</h3>
              <p><strong>URL:</strong> <a href="${result.url}" target="_blank">${result.url}</a></p>
              <p><strong>파일명:</strong> ${result.fileName}</p>
              <img src="${result.url}" style="max-width: 300px; margin-top: 10px;" alt="업로드된 이미지">
            </div>
          `;
        } else {
          resultDiv.innerHTML = `
            <div class="result error">
              <h3>❌ 업로드 실패 (${response.status})</h3>
              <pre>${JSON.stringify(result, null, 2)}</pre>
            </div>
          `;
        }
      } catch (error) {
        console.error('❌ 오류:', error);
        resultDiv.innerHTML = `
          <div class="result error">
            <h3>❌ 오류 발생</h3>
            <p>${error.message}</p>
            <pre>${error.stack}</pre>
          </div>
        `;
      } finally {
        uploadBtn.disabled = false;
      }
    }

    // 페이지 로드 시 세션 자동 확인
    window.onload = () => {
      checkSession();
    };
  </script>
</body>
</html>
