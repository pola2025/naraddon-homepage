<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>인트로 영상 로딩 — Wave vs Spinner 비교</title>
    <link
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Pretendard', system-ui, sans-serif;
      }
      body {
        background: #1a1a1a;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        gap: 60px;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
      }
      .compare {
        display: flex;
        gap: 40px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .box {
        width: 360px;
        height: 300px;
        background: #000;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        position: relative;
        overflow: hidden;
      }
      .label {
        position: absolute;
        top: 12px;
        left: 16px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.5);
        font-weight: 500;
      }
      .tag {
        position: absolute;
        top: 12px;
        right: 16px;
        font-size: 11px;
        padding: 3px 10px;
        border-radius: 12px;
        font-weight: 600;
      }
      .tag.old {
        background: rgba(255, 100, 100, 0.2);
        color: #ff8888;
      }
      .tag.current {
        background: rgba(76, 175, 80, 0.2);
        color: #4caf50;
      }
      .tag.candidate {
        background: rgba(100, 180, 255, 0.2);
        color: #88ccff;
      }

      /* 기존: CSS 스피너 */
      .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* 나라똔 Wave */
      .wave-container {
        display: flex;
        gap: 5px;
        align-items: flex-end;
        height: 50px;
      }
      .wave-bar {
        width: 6px;
        border-radius: 4px;
        background: linear-gradient(180deg, #059669, #6ee7b7);
        animation: wave 1.2s ease-in-out infinite;
      }
      @keyframes wave {
        0%,
        100% {
          height: 15px;
          opacity: 0.3;
        }
        50% {
          height: 45px;
          opacity: 1;
        }
      }
      .wave-bar:nth-child(1) {
        animation-delay: 0s;
      }
      .wave-bar:nth-child(2) {
        animation-delay: 0.1s;
      }
      .wave-bar:nth-child(3) {
        animation-delay: 0.2s;
      }
      .wave-bar:nth-child(4) {
        animation-delay: 0.3s;
      }
      .wave-bar:nth-child(5) {
        animation-delay: 0.4s;
      }
      .wave-bar:nth-child(6) {
        animation-delay: 0.5s;
      }
      .wave-bar:nth-child(7) {
        animation-delay: 0.6s;
      }

      /* 단색 멘트 */
      .msg-plain {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.6);
        letter-spacing: 0.5px;
        font-weight: 500;
      }

      /* 그라데이션 멘트 - 웨이브와 동기화된 시머 */
      .msg-gradient {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.5px;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.35) 0%,
          rgba(255, 255, 255, 0.35) 25%,
          #6ee7b7 45%,
          #059669 50%,
          #6ee7b7 55%,
          rgba(255, 255, 255, 0.35) 75%,
          rgba(255, 255, 255, 0.35) 100%
        );
        background-size: 200% 100%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: textShimmer 3s linear infinite;
      }
      @keyframes textShimmer {
        0% {
          background-position: 100% 50%;
        }
        100% {
          background-position: -100% 50%;
        }
      }

      /* 전체화면 미리보기 */
      .fullscreen-demo {
        width: 100%;
        max-width: 860px;
      }
      .fullscreen-box {
        width: 100%;
        aspect-ratio: 16/9;
        background: #000;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .fullscreen-label {
        text-align: center;
        color: rgba(255, 255, 255, 0.4);
        font-size: 14px;
        margin-top: 12px;
      }
      .section-title {
        font-size: 18px;
        margin-bottom: 16px;
        text-align: center;
        color: rgba(255, 255, 255, 0.7);
      }
    </style>
  </head>
  <body>
    <h1>인트로 영상 로딩 비교</h1>

    <div class="compare">
      <!-- A. 기존 -->
      <div class="box">
        <span class="label">A. 기존</span>
        <span class="tag old">삭제됨</span>
        <div class="spinner"></div>
        <p class="msg-plain">흰색 CSS 스피너 (멘트 없음)</p>
      </div>

      <!-- B. 현재 적용 -->
      <div class="box">
        <span class="label">B. 현재</span>
        <span class="tag current">적용됨</span>
        <div class="wave-container">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
        <p class="msg-plain">최적의 정책자금을 분석하고 있습니다</p>
      </div>

      <!-- C. 그라데이션 후보 -->
      <div class="box">
        <span class="label">C. 후보</span>
        <span class="tag candidate">검토중</span>
        <div class="wave-container">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
        <p class="msg-gradient">최적의 정책자금을 분석하고 있습니다</p>
      </div>
    </div>

    <!-- 전체화면 비교: B vs C -->
    <div class="fullscreen-demo">
      <h2 class="section-title">실제 인트로 로딩 화면 비교 (16:9)</h2>

      <div style="display: flex; gap: 20px; margin-bottom: 12px">
        <!-- B 전체화면 -->
        <div style="flex: 1">
          <div class="fullscreen-box">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
              <div class="wave-container">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
              </div>
              <p class="msg-plain">최적의 정책자금을 분석하고 있습니다</p>
            </div>
          </div>
          <p class="fullscreen-label">B. 단색 텍스트</p>
        </div>

        <!-- C 전체화면 -->
        <div style="flex: 1">
          <div class="fullscreen-box">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
              <div class="wave-container">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
              </div>
              <p class="msg-gradient">최적의 정책자금을 분석하고 있습니다</p>
            </div>
          </div>
          <p class="fullscreen-label">C. 그라데이션 시머 텍스트</p>
        </div>
      </div>
    </div>
  </body>
</html>
