<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고객용 이메일 미리보기 - 나라똔</title>
</head>
<body style="margin:0;padding:20px;background:#f3f4f6;">

<div style="font-family:Pretendard,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;max-width:600px;margin:0 auto;background:#FFFFFF;">

  <!-- 헤더 -->
  <div style="background:linear-gradient(135deg, #2D6A4F 0%, #40916C 100%);padding:40px 30px;border-radius:12px 12px 0 0;text-align:center;">
    <div style="width:60px;height:60px;background:#FFFFFF;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;">
      <span style="font-size:28px;">✅</span>
    </div>
    <h1 style="margin:0;color:#FFFFFF;font-size:24px;font-weight:700;">상담 신청 완료</h1>
    <p style="margin:12px 0 0;color:#95D5B2;font-size:15px;">접수가 정상적으로 완료되었습니다</p>
  </div>

  <!-- 본문 -->
  <div style="padding:32px 24px;">

    <!-- 인사말 -->
    <div style="background:linear-gradient(135deg, #D8F3DC 0%, #f0fdf4 100%);padding:24px;border-radius:12px;margin-bottom:24px;border-left:4px solid #52B788;">
      <p style="margin:0 0 12px;font-size:18px;color:#1F2937;">안녕하세요, <strong style="color:#2D6A4F;">홍길동</strong>님</p>
      <p style="margin:0;color:#4B5563;font-size:14px;line-height:1.7;">나라똔 상담 서비스에 신청해 주셔서 감사합니다.<br>전문 상담사가 빠른 시일 내에 연락드리겠습니다.</p>
    </div>

    <!-- 접수 내용 카드 -->
    <div style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;overflow:hidden;margin-bottom:24px;">
      <div style="background:#2D6A4F;padding:16px 20px;">
        <h3 style="margin:0;color:#FFFFFF;font-size:15px;font-weight:600;">📋 접수 내용</h3>
      </div>
      <table style="width:100%;border-collapse:collapse;">
        <tr>
          <td style="padding:14px 20px;font-size:13px;color:#4B5563;border-bottom:1px solid #E5E7EB;width:100px;">접수번호</td>
          <td style="padding:14px 20px;font-size:14px;color:#1F2937;font-weight:600;border-bottom:1px solid #E5E7EB;">202512271530</td>
        </tr>
        <tr>
          <td style="padding:14px 20px;font-size:13px;color:#4B5563;border-bottom:1px solid #E5E7EB;">접수일시</td>
          <td style="padding:14px 20px;font-size:14px;color:#1F2937;border-bottom:1px solid #E5E7EB;">2025-12-27 15:30:00</td>
        </tr>
        <tr>
          <td style="padding:14px 20px;font-size:13px;color:#4B5563;border-bottom:1px solid #E5E7EB;">상담 분야</td>
          <td style="padding:14px 20px;font-size:14px;color:#2D6A4F;font-weight:600;border-bottom:1px solid #E5E7EB;">정부지원금</td>
        </tr>
        <tr>
          <td style="padding:14px 20px;font-size:13px;color:#4B5563;">희망 시간</td>
          <td style="padding:14px 20px;font-size:14px;color:#1F2937;">오전 10시-12시</td>
        </tr>
      </table>
    </div>

    <!-- 안내 박스 -->
    <div style="background:linear-gradient(135deg, #40916C 0%, #52B788 100%);padding:24px;border-radius:12px;text-align:center;">
      <p style="margin:0 0 8px;color:#FFFFFF;font-size:16px;font-weight:700;">📞 영업일 기준 24시간 이내</p>
      <p style="margin:0;color:#D8F3DC;font-size:14px;">전문 상담사가 연락드리겠습니다</p>
    </div>

  </div>

  <!-- 푸터 -->
  <div style="background:#1B4332;padding:24px;text-align:center;border-radius:0 0 12px 12px;">
    <p style="margin:0 0 8px;color:#FFFFFF;font-size:14px;font-weight:600;">나라똔</p>
    <p style="margin:0 0 4px;color:#74C69D;font-size:12px;">소상공인 정책자금 플랫폼</p>
    <p style="margin:12px 0 0;color:#95D5B2;font-size:11px;">본 메일은 발신 전용입니다. 문의사항은 상담사 연락을 기다려주세요.</p>
  </div>

</div>

</body>
</html>
