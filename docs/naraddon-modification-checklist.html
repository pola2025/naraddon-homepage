    <script>
        // 페이지 로드 시 저장된 체크 상태 복원
        document.addEventListener('DOMContentLoaded', function() {
            loadProgress();
            updateProgress();
        });

        // 체크박스 변경 이벤트
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const label = this.closest('label');
                const textEl = label.querySelector('.item-text');

                if (this.checked) {
                    textEl.classList.add('checked-item');
                } else {
                    textEl.classList.remove('checked-item');
                }

                updateProgress();
                saveProgress();
            });
        });

        function updateProgress() {
            const allCheckboxes = document.querySelectorAll('input[type="checkbox"]');
            const checkedCheckboxes = document.querySelectorAll('input[type="checkbox"]:checked');

            const total = allCheckboxes.length;
            const completed = checkedCheckboxes.length;
            const percentage = Math.round((completed / total) * 100);

            document.getElementById('progressBar').style.width = percentage + '%';
            document.getElementById('progressText').textContent = percentage + '%';
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('totalCount').textContent = total;

            // 섹션별 진행률 업데이트
            const sections = ['main', 'naraddon', 'policy', 'voice', 'examiner', 'expert'];
            sections.forEach(section => {
                const sectionCheckboxes = document.querySelectorAll(`input[data-section="${section}"]`);
                const sectionChecked = document.querySelectorAll(`input[data-section="${section}"]:checked`);
                const sectionText = `${sectionChecked.length}/${sectionCheckboxes.length}`;

                document.querySelectorAll(`.section-progress[data-section="${section}"]`).forEach(el => {
                    el.textContent = sectionText;
                });
                document.querySelectorAll(`.section-summary[data-section="${section}"]`).forEach(el => {
                    el.textContent = sectionText;
                });
            });
        }

        function saveProgress() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            const state = {};
            checkboxes.forEach((checkbox, index) => {
                state[index] = checkbox.checked;
            });
            localStorage.setItem('naraddon-checklist', JSON.stringify(state));
            localStorage.setItem('naraddon-checklist-updated', new Date().toLocaleString('ko-KR'));
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('ko-KR');
        }

        function loadProgress() {
            const saved = localStorage.getItem('naraddon-checklist');
            const updated = localStorage.getItem('naraddon-checklist-updated');

            if (saved) {
                const state = JSON.parse(saved);
                const checkboxes = document.querySelectorAll('input[type="checkbox"]');
                checkboxes.forEach((checkbox, index) => {
                    if (state[index]) {
                        checkbox.checked = true;
                        const label = checkbox.closest('label');
                        const textEl = label.querySelector('.item-text');
                        textEl.classList.add('checked-item');
                    }
                });
            }

            if (updated) {
                document.getElementById('lastUpdate').textContent = updated;
            }
        }

        function resetAll() {
            if (confirm('모든 체크를 초기화하시겠습니까?')) {
                document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                    checkbox.checked = false;
                    const label = checkbox.closest('label');
                    const textEl = label.querySelector('.item-text');
                    textEl.classList.remove('checked-item');
                });
                updateProgress();
                saveProgress();
            }
        }
    </script>
